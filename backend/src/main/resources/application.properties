spring.application.name=rml-manager
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.org.hibernate.envers.global_with_modified_flag=true

# pagination defaults
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50

# s3/minIO
storage.s3.region=us-east-1
storage.s3.endpoint=http://localhost:9000
storage.s3.path-style-access=true
storage.s3.bucket=rml-assets
storage.s3.presigned-url-expiration=PT1H
storage.s3.access-key=minioadmin
storage.s3.secret-key=minioadmin

# seed admin ? password intentionally omitted; set via APP_ADMIN_PASSWORD env var
# or app.admin.password in a profile-specific properties file
app.admin.username=admin

# multipart / upload limits (KAN-21)
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB
# spool to disk beyond this so the body is not buffered in heap
spring.servlet.multipart.file-size-threshold=2MB

# application-level geometry size cap (>= this -> 413)
storage.upload.max-geometry-size=512MB